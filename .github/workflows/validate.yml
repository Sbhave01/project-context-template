name: Validate memory

on:
  pull_request:
    paths: ["memory/**", "prompts/**", "docs/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check memory files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/validate-memory.sh
